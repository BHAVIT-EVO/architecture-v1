<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Instrument+Serif&display=swap">
<style>
:root{--ink:#06120e;--panel:rgba(9,21,17,.9);--line:rgba(240,234,216,.13);--text:#f0ead8;--muted:#a9b8ab;--faint:#7f9283;
 --accent:#8fe0a8;--on:#06180f;--serif:"Instrument Serif",Georgia,serif;--ui:"Instrument Sans",system-ui,-apple-system,sans-serif;--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box;margin:0}
body{font:15px/1.45 var(--ui);color:var(--text);background:var(--ink);min-height:100vh;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:10px}
svg.i{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
#cv{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;image-rendering:pixelated;z-index:-2}
.veil{position:fixed;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(90deg,rgba(4,12,10,.78),rgba(4,12,10,.2) 48%,transparent 70%),linear-gradient(180deg,rgba(4,12,10,.5),transparent 22%)}

.bar{position:relative;z-index:5;display:flex;align-items:center;gap:10px;height:66px;padding:0 22px 0 20px}
.dots{display:flex;gap:8px;width:66px}.dots i{width:12px;height:12px;border-radius:50%;background:#ff5f57}
.dots i:nth-child(2){background:#febc2e}.dots i:nth-child(3){background:#28c840}
.brand{display:flex;align-items:center;gap:9px;font-weight:600;font-size:19px}
.logo{width:28px;height:28px;border-radius:9px;background:var(--accent);display:grid;place-items:center;color:var(--on)}
.sp{flex:1}
.chip{display:flex;align-items:center;gap:8px;height:34px;padding:0 13px;border-radius:99px;background:rgba(9,21,17,.74);border:1px solid var(--line);font-size:13px;font-weight:500;color:var(--muted)}
.chip svg.i{width:15px;height:15px}
.live{display:flex;gap:2px;align-items:center;height:12px}.live i{width:2px;height:4px;border-radius:2px;background:var(--accent);animation:eq 1.1s ease-in-out infinite}
.live i:nth-child(2){animation-delay:.15s}.live i:nth-child(3){animation-delay:.3s}.live i:nth-child(4){animation-delay:.45s}
@keyframes eq{50%{height:12px}}
.seg{display:flex;padding:3px;border-radius:99px;background:rgba(9,21,17,.74);border:1px solid var(--line)}
.seg button{height:28px;padding:0 13px;border-radius:99px;font-size:13px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--text);color:var(--ink)}
.search{width:200px}.search input{flex:1;min-width:0;background:none;border:0;outline:0;font:inherit;color:var(--text)}
.search input::placeholder{color:var(--faint)}.search kbd{font:500 11px var(--ui);border:1px solid var(--line);border-radius:6px;padding:1px 6px}
.icon{width:36px;height:36px;display:grid;place-items:center;border-radius:50%;background:rgba(9,21,17,.74);border:1px solid var(--line);color:var(--muted)}

.notch{position:fixed;left:50%;top:0;z-index:60;width:150px;height:32px;margin-left:-75px;border-radius:0 0 18px 18px;background:#020504;color:var(--text);display:flex;align-items:center;justify-content:center;gap:12px;overflow:hidden;
 transition:width .45s var(--ease),height .45s var(--ease),margin .45s var(--ease),border-radius .45s var(--ease)}
.notch[data-on]{width:460px;height:68px;margin-left:-230px;border-radius:0 0 28px 28px;box-shadow:0 24px 50px -16px #000}
.notch .w{display:flex;gap:3px;align-items:center;height:26px;opacity:0;transition:opacity .2s}.notch[data-on] .w{opacity:1}
.notch .w i{width:3px;height:6px;border-radius:2px;background:var(--accent);animation:eq2 .9s ease-in-out infinite}
.notch .w i:nth-child(odd){animation-delay:.2s}.notch .w i:nth-child(3n){animation-delay:.4s}@keyframes eq2{50%{height:24px}}
.notch .tx{opacity:0;white-space:nowrap;font-size:14px;transition:opacity .2s}.notch[data-on] .tx{opacity:1}.notch .tx b{font-weight:500;color:var(--accent)}

.left{position:fixed;z-index:4;left:32px;top:92px;bottom:28px;width:min(360px,calc(100vw - 64px));display:flex;flex-direction:column;gap:18px}
h1{font:400 56px/1.02 var(--serif);letter-spacing:-.015em;min-height:2.05em}
h1 .caret{display:inline-block;width:2px;height:.75em;margin-left:3px;background:var(--accent);animation:blink 1s steps(1) infinite}
h1 .caret.done{animation:fade .6s forwards}@keyframes blink{50%{opacity:0}}@keyframes fade{to{opacity:0}}
.sub{margin-top:-6px;color:var(--muted);font-size:16px;max-width:30ch}
.card{padding:22px;border-radius:24px;background:var(--panel);border:1px solid var(--line);box-shadow:0 30px 60px -24px #000;animation:arrive .9s .8s var(--ease) both}
@keyframes arrive{from{opacity:0;filter:blur(8px);transform:translateY(30px)}}
.when{font-size:13px;color:var(--faint)}
.card h2{font:400 31px/1.08 var(--serif);margin-top:8px;letter-spacing:-.01em}
.src{display:flex;align-items:center;gap:8px;margin-top:10px;color:var(--muted);font-size:14px}
.act{display:flex;align-items:center;gap:8px;margin-top:20px}
.btn{display:inline-flex;align-items:center;height:46px;padding:0 26px;border-radius:99px;background:var(--accent);color:var(--on);font-weight:600;transition:transform .18s var(--ease),box-shadow .18s}
.btn:hover{transform:translateY(-1px);box-shadow:0 10px 24px -10px rgba(143,224,168,.7)}.btn:active{transform:scale(.98)}
.more{width:40px;height:40px;display:grid;place-items:center;border-radius:50%;color:var(--faint)}.more:hover,.more[aria-expanded=true]{background:rgba(240,234,216,.08);color:var(--text)}
.menu{position:absolute;left:0;bottom:calc(100% + 6px);z-index:20;min-width:210px;padding:6px;border-radius:16px;background:#10241c;border:1px solid var(--line);box-shadow:0 24px 48px -14px #000;display:none}
.menu[data-open]{display:block}.menu button{display:block;width:100%;text-align:left;padding:9px 12px;border-radius:10px;font-size:14px}.menu button:hover{background:rgba(240,234,216,.07)}
.foot{margin-top:auto;display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.link{color:var(--muted);font-weight:500;font-size:14px;padding:6px 2px;text-decoration:underline;text-underline-offset:4px}.link:hover{color:var(--text)}
.soon{display:flex;gap:8px;flex-wrap:wrap}.soon span{font-size:13px;color:var(--muted);padding:5px 12px;border-radius:99px;border:1.5px dashed rgba(240,234,216,.25)}
.trust{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}.trust button{text-decoration:underline;text-underline-offset:3px;color:var(--text);font-weight:500}

.hit{position:fixed;z-index:3;border-radius:6px;transition:background .15s}.hit:hover{background:rgba(143,224,168,.08)}
.hit .tag{position:absolute;left:50%;bottom:calc(100% + 8px);transform:translateX(-50%);white-space:nowrap;max-width:240px;overflow:hidden;text-overflow:ellipsis;padding:5px 11px;border-radius:99px;background:var(--panel);border:1px solid var(--line);font-size:12px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .15s}
.hit:hover .tag,.hit:focus-visible .tag{opacity:1}

.list{position:fixed;z-index:3;right:28px;top:84px;bottom:24px;width:min(560px,calc(100vw - 460px));min-width:300px;padding:10px;border-radius:24px;background:var(--panel);border:1px solid var(--line);overflow:auto;display:none}
body[data-view=list] .list{display:block}body[data-view=list] .hit{display:none}
.row{display:grid;grid-template-columns:38px minmax(0,1fr) auto;align-items:center;gap:14px;width:100%;text-align:left;padding:10px;border-radius:14px}
.row:hover,.row[aria-current=true]{background:rgba(240,234,216,.07)}
.row .tl{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:rgba(240,234,216,.07);color:var(--muted)}
.row strong{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row small{display:block;color:var(--faint);font-size:13px}.row time{color:var(--faint);font-size:13px}
@media (max-width:860px){.dots,.search,.chip.pri{display:none}.list{left:28px;width:auto}h1{font-size:42px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

 <symbol id="web" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></symbol>

 <symbol id="dots" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.2" fill="currentColor"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/><circle cx="19" cy="12" r="1.2" fill="currentColor"/></symbol>
</defs></svg>

<!-- The clearing is drawn in code at 320x180 and scaled up. Swap for painted art later: replace #cv with an <img>. -->
<canvas id="cv" aria-hidden="true"></canvas><div class="veil"></div>
<div class="notch" id="notch" role="status" aria-live="polite"><div class="w" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div><div class="tx" id="ntx"></div></div>

<header class="bar">
 <div class="dots" aria-hidden="true"><i></i><i></i><i></i></div>
 <div class="brand"><span class="logo"><svg class="i"><path d="M12 20V10M12 10c0-4 3-6 7-6 0 4-3 6-7 6zM12 14c0-3-2.5-5-6-5 0 3 2.5 5 6 5z"/></svg></span>evo</div>
 <span class="sp"></span>
 <span class="chip pri"><span class="live" aria-hidden="true"><i></i><i></i><i></i><i></i></span>Listening for &ldquo;Hey Evo&rdquo;</span>
 <span class="chip pri"><svg class="i"><use href="#lock"/></svg>Stays on this Mac</span>

</header>

<aside class="left">
 <h1 aria-label="Pick up where you left off."><span id="ht"></span><span class="caret" id="caret"></span></h1>
 <p class="sub">Everything you were working on, in the order you left it.</p>
 <section class="card" aria-live="polite">
  <p class="when" id="pw"></p><h2 id="pt"></h2>
  <p class="src"><svg class="i" id="pi"><use href="#chat"/></svg><span id="ps"></span></p>
  <div class="act"><button class="btn" id="cont">Continue</button><div style="position:relative"><button class="more" id="mb" aria-label="More for this work" aria-expanded="false"><svg class="i"><use href="#dots"/></svg></button>
   <div class="menu" id="mn" role="menu"><button role="menuitem">Rename</button><button role="menuitem">Restore earlier version</button><button role="menuitem">This isn&rsquo;t work</button><button role="menuitem">Hide from Home</button><button role="menuitem">Merge with&hellip;</button></div></div></div>
 </section>
 <div class="foot">
  <button class="link" id="more33">Show 33 more in the list</button>

 </div>
</aside>

<script>
const $=s=>document.querySelector(s),sleep=ms=>new Promise(r=>setTimeout(r,ms)),rm=matchMedia('(prefers-reduced-motion:reduce)').matches;
const works=[
 {t:'Frontend prompt for product redesign',s:'A Claude chat in Chrome',w:'Last open an hour ago',i:'chat',k:'book'},
 {t:'Eating at every Tollywood celebrity restaurant for 24 hours',s:'YouTube in Chrome, audio playing',w:'Last open 2 hours ago',i:'play',k:'paper'},
 {t:'Untitled chat',s:'Claude in Chrome',w:'Last open 2 days ago',i:'chat',k:'folder'},
 {t:'YC application script request',s:'Claude in Chrome',w:'Last open 6 days ago',i:'chat',k:'notebook'},
 {t:'Watch The Family Man',s:'Chrome',w:'Last open 7 days ago',i:'play',k:'paper'},
 {t:'Muse',s:'Freebuff',w:'Last open 7 days ago',i:'dir',k:'folder'}];
const TS=[.80,.62,.48,.36,.26,.17],pos=t=>({x:250-100*t+8*Math.sin(t*5),y:114+66*t});
works.forEach((w,i)=>{const t=TS[i],p=pos(t);w.x=p.x;w.y=p.y;w.u=t>.7?3:t>.4?2:1});
const DIM={book:[7,4],paper:[5,6],folder:[7,5],notebook:[5,6]};

// ---------- procedural pixel art ----------
const W=320,H=180,cv=$('#cv'),g=cv.getContext('2d');cv.width=W;cv.height=H;
const st=document.createElement('canvas');st.width=W;st.height=H;const s=st.getContext('2d');
let seed=11;const rnd=()=>(seed=seed*16807%2147483647)/2147483647;
const P=(c,col,x,y,w=1,h=1,a=1)=>{c.fillStyle=col;c.globalAlpha=a;c.fillRect(Math.round(x),Math.round(y),w,h);c.globalAlpha=1};
const pine=(x,b,h,col)=>{for(let i=0;i<h;i++){const hw=Math.floor(i*.28)+(i%4==3?1:0);P(s,col,x-hw,b-h+i,hw*2+1,1)}P(s,col,x,b,1,2)};
const sky=['#04090e','#06141b','#09202a','#0d2c31','#133b37','#1b4b3e','#2a5d41','#476b3d','#78793f','#b18541','#dc9b4b'];
for(let y=0;y<120;y++)for(let x=0;x<W;x++){const v=y/119*(sky.length-1),i=Math.floor(v),f=v-i;P(s,sky[Math.min(10,i+(f>(((x^y)&1)?.35:.7)?1:0))],x,y)}
for(let y=-9;y<=9;y++)for(let x=-9;x<=9;x++){if(x*x+y*y<=64&&(x+4)*(x+4)+(y-3)*(y-3)>56)P(s,'#f3eed2',262+x,34+y)}
const stars=Array.from({length:60},()=>({x:rnd()*W|0,y:rnd()*72|0,p:rnd()*9}));
for(let x=0;x<W;x++)P(s,'#10302b',x,Math.floor(108+6*Math.sin(x*.03)+4*Math.sin(x*.07+1)),1,14);
for(let x=-4;x<W+8;x+=8+(rnd()*6|0))pine(x,124,12+(rnd()*10|0),'#0b2420');
const gc=['#1d4a34','#1a4431','#163c2a','#123424'];
for(let y=120;y<H;y++)for(let x=0;x<W;x++)P(s,gc[Math.min(3,Math.floor((y-120)/16+rnd()*.8))],x,y);
for(let i=0;i<320;i++)P(s,'#33704a',rnd()*W|0,121+(rnd()*58|0));
for(let i=0;i<40;i++)P(s,'#e8e0a0',rnd()*W|0,125+(rnd()*52|0));
for(let y=114;y<H;y++){const t=(y-114)/66,cx=250-100*t+8*Math.sin(t*5),w=6+30*t;
 for(let x=Math.floor(cx-w/2);x<=cx+w/2;x++){const e=x<=cx-w/2+1||x>=cx+w/2-1,n=Math.abs((x>>1)*31+(y>>1)*17)%3;
  P(s,e?'#3d4a42':(((y>>2)&1)==0&&Math.abs(x+(y>>2)*3)%7==0)?'#46544b':['#6b7a70','#7d8b80','#5a685e'][n],x,y)}}
[[8,150,56],[36,146,42],[302,152,58],[318,142,44],[286,138,30]].forEach(a=>pine(a[0],a[1],a[2],'#04120f'));
for(let i=0;i<4;i++)P(s,'#8fe0a8',226-i*6,116+i*3,14+i*8,3-(i>1?1:0),.05); // screen glow on the ground
P(s,'#cfc8aa',236,92,28,22);P(s,'#e8e1c4',236,92,28,2);P(s,'#a39d84',262,92,2,22);P(s,'#9a947d',244,114,12,2);P(s,'#071512',239,95,22,15);
const FONT={e:['111','101','111','100','011'],v:['101','101','101','101','010'],o:['010','101','101','101','010']};

// ---------- state ----------
let sel=0,hov=-1,listening=false;
function spr(k,x,y,u,lift,hl,f){const d=DIM[k],w=d[0]*u,h=d[1]*u,l=Math.round(x-w/2),t=Math.round(y-h-lift),w2=Math.floor(w/2);
 P(g,'#000',l+1,y-1,w,2,.4);if(hl)P(g,'#8fe0a8',l-1,t-1,w+2,h+2);
 if(k=='book'){P(g,'#e6dcbc',l,t,w2,h);P(g,'#f4eed8',l+w2,t,w-w2,h);P(g,'#7a4b2a',l+w2,t,u,h);for(let i=u;i<h-u;i+=2*u)P(g,'#b8ad8a',l+u,t+i,Math.max(1,w2-2*u),u)}
 if(k=='paper'){P(g,'#f2efe3',l,t,w,h);for(let i=2*u;i<h-u;i+=2*u)P(g,'#b3ad96',l+u,t+i,w-2*u,u);P(g,'#cfc9b2',l+w-u,t,u,u)}
 if(k=='folder'){P(g,'#c2933f',l,t-u,3*u,u);P(g,'#dcae52',l,t,w,h);P(g,'#c2933f',l,t+h-u,w,u)}
 if(k=='notebook'){P(g,'#3f7f9a',l,t,w,h);P(g,'#2c5b70',l,t,u,h);P(g,'#e6dcbc',l+2*u,t+u,2*u,2*u)}
 if(hl){const b=Math.round(Math.sin(f*.5)*1.2),ty=t-6+b;P(g,'#8fe0a8',x-2,ty,5,1);P(g,'#8fe0a8',x-1,ty+1,3,1);P(g,'#8fe0a8',x,ty+2,1,1)}}
const fl=Array.from({length:18},()=>({x:rnd()*W,y:112+rnd()*60,vx:(rnd()-.5)*.3,vy:(rnd()-.5)*.2,p:rnd()*9}));
function draw(f){g.globalAlpha=1;g.drawImage(st,0,0);
 stars.forEach(a=>P(g,'#d8eadf',a.x,a.y,1,1,.35+.65*Math.max(0,Math.sin(f*.07+a.p))));
 P(g,listening?'#14513f':'#0f3a2e',239,95,22,15);P(g,'#1f6a52',239,95+(f%15),22,1,.45);
 if(listening){for(let i=0;i<5;i++){const h=2+Math.abs(Math.sin(f*.6+i*1.7))*9|0;P(g,'#8fe0a8',241+i*4,110-h,2,h)}}
 else{let x=243;['e','v','o'].forEach(c=>{FONT[c].forEach((r,y)=>{for(let k=0;k<3;k++)if(r[k]=='1')P(g,'#8fe0a8',x+k,99+y)});x+=6})}
 const a=hov>=0?hov:sel;
 for(let i=works.length-1;i>=0;i--){const w=works[i],on=i==a;spr(w.k,w.x,w.y,w.u,on?w.u:0,on,f)}
 fl.forEach(o=>{o.x+=o.vx;o.y+=o.vy;o.p+=.1;if(o.x<0||o.x>W)o.vx*=-1;if(o.y<108||o.y>176)o.vy*=-1;const al=.3+.7*Math.max(0,Math.sin(o.p));P(g,'#f4d98f',o.x-1,o.y-1,3,3,.12*al);P(g,'#f6e6a8',o.x,o.y,1,1,al)})}
let frame=0;if(rm)draw(0);else setInterval(()=>draw(frame++),80);

// ---------- layout of click targets (canvas is object-fit:cover) ----------
const hits=[];
function mk(label,fn){const b=document.createElement('button');b.className='hit';b.setAttribute('aria-label',label);b.innerHTML='<span class="tag">'+label+'</span>';b.onclick=fn;document.body.append(b);return b}
works.forEach((w,i)=>{const b=mk(w.t,()=>pick(i));b.onmouseenter=()=>{hov=i;show(i);rm&&draw(0)};b.onmouseleave=()=>{hov=-1;show(sel);rm&&draw(0)};b.onfocus=b.onmouseenter;b.onblur=b.onmouseleave;hits.push(b)});
const crt=mk('Talk to Evo',()=>demo());crt.style.borderRadius='10px';
function layout(){const c=Math.max(innerWidth/W,innerHeight/H),ox=(innerWidth-W*c)/2,oy=(innerHeight-H*c)/2;
 works.forEach((w,i)=>{const d=DIM[w.k],pw=d[0]*w.u,ph=d[1]*w.u,b=hits[i];b.style.left=ox+(w.x-pw/2-2)*c+'px';b.style.top=oy+(w.y-ph-4)*c+'px';b.style.width=(pw+4)*c+'px';b.style.height=(ph+6)*c+'px'});
 crt.style.left=ox+236*c+'px';crt.style.top=oy+92*c+'px';crt.style.width=28*c+'px';crt.style.height=24*c+'px'}
addEventListener('resize',layout);layout();

// ---------- panel, list, menus ----------
function show(i){const w=works[i];$('#pw').textContent=w.w;$('#pt').textContent=w.t;$('#ps').textContent=w.s;$('#pi').innerHTML='<use href="#'+w.i+'"/>'}
function pick(i){sel=i;show(i);document.querySelectorAll('.row').forEach((r,j)=>r.setAttribute('aria-current',j==i));rm&&draw(0)}
$('#list').innerHTML=works.map((w,i)=>'<button class="row" data-i="'+i+'"><span class="tl"><svg class="i"><use href="#'+w.i+'"/></svg></span><span><strong>'+w.t+'</strong><small>'+w.s+'</small></span><time>'+w.w.replace('Last open ','')+'</time></button>').join('');
document.querySelectorAll('.row').forEach(r=>r.onclick=()=>pick(+r.dataset.i));
function view(v){document.body.dataset.view=v;$('#vs').setAttribute('aria-pressed',v=='scene');$('#vl').setAttribute('aria-pressed',v=='list')}
$('#vs').onclick=()=>view('scene');$('#vl').onclick=()=>view('list');$('#more33').onclick=()=>view('list');
$('#mb').onclick=e=>{e.stopPropagation();const o=$('#mn').hasAttribute('data-open');$('#mn').toggleAttribute('data-open',!o);$('#mb').setAttribute('aria-expanded',!o)};
const closeM=()=>{$('#mn').removeAttribute('data-open');$('#mb').setAttribute('aria-expanded','false')};
document.addEventListener('click',closeM);
pick(0);

// ---------- headline and the notch ----------
(async()=>{const t='Pick up where you left off.',el=$('#ht');for(const c of t){el.textContent+=c;if(!rm)await sleep(42)}$('#caret').classList.add('done')})();
const n=$('#notch'),tx=$('#ntx');let busy=false;
async function demo(){if(busy)return;busy=true;listening=true;n.dataset.on='';tx.innerHTML='<b>Listening</b>';rm&&draw(0);await sleep(700);
 const q='Open my last project';tx.textContent='';for(const c of q){tx.textContent+=c;await sleep(rm?0:55)}
 await sleep(500);listening=false;tx.innerHTML='<b>Opening</b> '+works[sel].t;rm&&draw(0);await sleep(1800);tx.innerHTML='<b>Done</b>';await sleep(700);delete n.dataset.on;busy=false}
$('#cont').onclick=demo;
addEventListener('keydown',e=>{if(e.key==='Escape')closeM();if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#q').focus()}
 if(e.code==='Space'&&!/INPUT|BUTTON/.test(document.activeElement.tagName)){e.preventDefault();demo()}});
</script>
</body>
</html>

		<meta http-equiv="X-UA-Compatible" content="IE=edge" />
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width,initial-scale=1.0" />
		<title>Rambox</title>
		<style media="screen">
			body {
				margin: 0;
				padding: 0;
				overflow: hidden;
				text-align: center;
				width: 340px;
				height: 340px;
			}
			.circle {
				background-color: #1e2942;
				background-image: url('images/pattern.svg');
				background-size: 80px;
				width: 300px;
				height: 300px;
				border-radius: 50%;
				box-shadow:
					-10px 0px 13px -7px #000000,
					10px 0px 13px -7px #000000,
					5px 5px 15px 5px rgba(0, 0, 0, 0);
				border: 1px solid #000;
			}
			body.linux .circle {
				border-radius: 0 !important;
				width: 100% !important;
				height: 100% !important;
				box-shadow: none !important;
			}

			#grayscale-logo .octopus {
				fill: transparent;
			}

			#color-logo .octopus {
				fill: #1a9499;
			}

			#grayscale-mask,
			#color-mask {
				fill: white;
			}

			#grayscale-mask path,
			#color-mask path {
				animation: waves 0.66s infinite linear;
			}

			@keyframes waves {
				from {
					transform: translateX(17rem);
				}
				to {
					transform: translateX(-17rem);
				}
			}

			#grayscale-mask g,
			#color-mask g {
				animation: raise 4s infinite ease-in-out;
				animation-direction: alternate;
			}

			@keyframes raise {
				from {
					transform: translateY(7rem);
				}
				to {
					transform: translateY(-15rem);
				}
			}
			.center-flex {
				display: flex;
				align-items: center;
				justify-content: center;
			}
		</style>

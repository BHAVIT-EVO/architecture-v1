[package]
name = "evo-desktop"
version = "0.1.0"
edition = "2024"
description = "Evo desktop shell — macOS-native presentation of the canonical Workspace/Snapshot state"

[dependencies]
eframe = "0.35"
egui = "0.35"
evo-artifact = { path = "../evo-artifact" }
evo-daemon = { path = "../evo-daemon" }
evo-threads = { path = "../evo-threads" }
evo-ledger = { path = "../evo-ledger" }
evo-engagement = { path = "../evo-engagement" }
evo-execution = { path = "../evo-execution" }
evo-pods = { path = "../evo-pods" }
evo-restoration = { path = "../evo-restoration" }
evo-storage = { path = "../evo-storage" }
evo-voice = { path = "../evo-voice" }
evo-workspace = { path = "../evo-workspace" }

[features]
# Propagates local semantic embeddings into the daemon dependency. Voice audio
# and wake-word support remain independently opt-in.
embeddings = ["evo-daemon/embeddings", "evo-voice/embeddings"]
# Voice audio pipeline: mic capture + whisper transcription. Requires
# hardware and the bundled whisper model; the socket client and panel
# work without it.
voice-audio = ["evo-voice/audio"]
# Trained acoustic wake-word spotting (openWakeWord ONNX models beside
# the exe): melspectrogram.onnx, embedding_model.onnx, hey_evoh.onnx.
voice-wake = ["voice-audio", "evo-voice/wake-model"]
# The notch/Dynamic-Island surface: engine + macOS window + occupancy
# probe. Independent of audio; the voice wiring joins them at runtime.
evo-notch = []

[dev-dependencies]
evo-capture = { path = "../evo-capture" }
evo-observation = { path = "../evo-observation" }

[[bin]]
# The headless always-on voice agent (no window; the notch is the UI).
name = "evo-agent"
path = "src/bin/evo-agent.rs"
required-features = ["voice-wake", "evo-notch"]

[[bin]]
# Installs evo-agent as a login LaunchAgent (idempotent launchctl step).
# Feature-independent: it only writes a plist and calls launchctl; the
# agent it points at must of course have been built with the features.
name = "evo-agent-install"
path = "src/bin/evo-agent-install.rs"

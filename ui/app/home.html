<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Evo — Home</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../components.css">
<link rel="stylesheet" href="../scene/scene.css">
<link rel="stylesheet" href="home.css">
<link rel="stylesheet" href="entry.css">
<link rel="stylesheet" href="screens.css">
</head>
<body class="home" data-view="scene">

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="web" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></symbol>
  <symbol id="play" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="4"/><path d="m10 9.5 5 2.5-5 2.5z"/></symbol>
  <symbol id="chat" viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></symbol>
  <symbol id="dir" viewBox="0 0 24 24"><path d="M3 7h6l2 2h10v10H3z"/></symbol>
  <symbol id="lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></symbol>
  <symbol id="search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
  <symbol id="gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></symbol>
  <symbol id="dots" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.4" fill="currentColor"/><circle cx="12" cy="12" r="1.4" fill="currentColor"/><circle cx="19" cy="12" r="1.4" fill="currentColor"/></symbol>
</defs></svg>

<div class="scene" data-mode="home"><canvas aria-hidden="true"></canvas><div class="veil"></div></div>

<div class="notch" id="notch" role="status" aria-live="polite">
  <div class="w" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
  <div class="tx" id="ntx"></div>
</div>

<header class="bar">
  <div class="dots" aria-hidden="true"><i></i><i></i><i></i></div>
  <button class="brand" id="trayAnchor" aria-haspopup="menu" aria-label="Evo menu"><span class="logo"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20V10M12 10c0-4 3-6 7-6 0 4-3 6-7 6zM12 14c0-3-2.5-5-6-5 0 3 2.5 5 6 5z"/>  </svg></span>evo</button>
  <span class="sp"></span>
  <span class="chip pri chip-live"><span class="live" aria-hidden="true"><i></i><i></i><i></i><i></i></span>Listening for “Hey Evo”</span>
  <span class="chip pri"><svg class="i" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><use href="#lock"/></svg>Stays on this Mac</span>
  <div class="segmented" role="group" aria-label="View">
    <button id="vs" aria-pressed="true">Scene</button>
    <button id="vl" aria-pressed="false">List</button>
  </div>
  <label class="chip search">
    <svg class="i" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><use href="#search"/></svg>
    <input id="q" placeholder="Search your work" aria-label="Search your work">
    <kbd>⌘K</kbd>
  </label>
  <button class="icon-button" aria-label="Settings" id="settings"><svg class="i" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><use href="#gear"/></svg></button>
</header>

<aside class="left">
  <h1 aria-label="Pick up where you left off."><span id="ht"></span><span class="caret" id="caret"></span></h1>
  <p class="sub">Everything you were working on, in the order you left it.</p>
  <section class="panel-card card" aria-live="polite">
    <p class="when" id="pw"></p>
    <h2 class="t-card-title" id="pt"></h2>
    <p class="src"><svg class="i" id="pi"><use href="#chat"/></svg><span id="ps"></span></p>
    <div class="act">
      <button class="btn-primary" id="cont">Continue</button>
      <div class="menu-wrap">
        <button class="more" id="mb" aria-label="More for this work" aria-expanded="false"><svg class="i"><use href="#dots"/></svg></button>
        <div class="menu" id="mn" role="menu"></div>
      </div>
    </div>
  </section>
  <div class="foot">
    <button class="link" id="moreN" hidden></button>
    <div class="soon" aria-label="Coming next"><span>Memory, coming soon</span><span>Autopilot, coming soon</span></div>
    <p class="trust"><svg class="i"><use href="#lock"/></svg>Evo only sees what you allow. <button>See activity and permissions</button></p>
  </div>
</aside>

<div class="list" id="list" role="list" aria-label="All recent work"></div>

<div class="intro" id="intro" hidden>
  <div class="dim"></div>
  <div class="caption"><h1><span id="introText"></span><span class="caret"></span></h1></div>
</div>

<div class="onboard" id="onboard" hidden></div>

<script type="module" src="home.js"></script>
</body>
</html>
